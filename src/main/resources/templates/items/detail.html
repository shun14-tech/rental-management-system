<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>備品詳細 | 備品貸出管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">備品詳細・貸出申請</h5>
                </div>
                <div class="card-body">
                    <h3 th:text="${item.name}">MacBook Pro</h3>
                    <p class="text-muted">カテゴリ: <span th:text="${item.category}">PC</span></p>
                    <hr>
                    
                    <div th:if="${item.availableQuantity > 0}">
                        <p class="text-success fw-bold">現在貸出可能です（残り <span th:text="${item.availableQuantity}"></span> 台）</p>
                        
                        <form th:action="@{/items/{id}/apply(id=${item.itemId})}" method="post">
                            <div class="mb-3">
                                <label for="returnDeadline" class="form-label">返却予定日</label>
                                <input type="date" class="form-control" id="returnDeadline" name="returnDeadline" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">貸出を申請する</button>
                        </form>
                    </div>
                    
                    <div th:unless="${item.availableQuantity > 0}" class="alert alert-danger">
                        現在、全て貸出中のため申請できません。
                    </div>

                    <div class="mt-3 text-center">
                        <a href="/items" class="text-decoration-none">← 一覧へ戻る</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
