<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>備品一覧 | 備品貸出管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/items">備品貸出管理</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/items">備品一覧</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning" href="/admin/rentals">貸出承認管理 (管理者用)</a>
                </li>
            </ul>
            <span class="navbar-text me-3" sec:authentication="name">ユーザー名</span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-sm btn-outline-light" type="submit">ログアウト</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>備品一覧</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/register}" class="btn btn-success">＋ 備品を新規登録</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>カテゴリ</th>
                        <th>備品名</th>
                        <th>在庫状況</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.itemId}"></td>
                        <td><span class="badge bg-secondary" th:text="${item.category}"></span></td>
                        <td th:text="${item.name}"></td>
                        <td>
                            <span th:classappend="${item.availableQuantity > 0} ? 'text-primary' : 'text-danger fw-bold'"
                                  th:text="${item.availableQuantity} + ' / ' + ${item.totalQuantity}"> </span>
                        </td>
                        <td>
                            <a th:href="@{/items/{id}(id=${item.itemId})}" class="btn btn-sm btn-outline-primary">詳細・申請</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
