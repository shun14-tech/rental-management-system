<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン | 備品貸出管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">システムログイン</h3>
                    
                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        メールアドレスまたはパスワードが違います。
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success text-center">
                        ログアウトしました。
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="mailaddress" class="form-label">メールアドレス</label>
                            <input type="email" class="form-control" id="mailaddress" name="mailaddress" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">パスワード</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">ログイン</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
