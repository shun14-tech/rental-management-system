<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>貸出管理 | 備品貸出管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">貸出・申請管理 (管理者用)</h2>
    <div class="mt-3 mb-3">
         <a href="/items" class="btn btn-secondary btn-sm">← 一覧へ戻る</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>申請日</th>
                        <th>申請者</th>
                        <th>備品名</th>
                        <th>返却予定日</th>
                        <th>ステータス</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rental : ${rentals}">
                      <td th:text="${rental.requestDate}">2026/06/27</td>

                   <td th:text="${rental.userName}">一般 一郎</td>
                   <td th:text="${rental.itemName}">MacBook Pro</td>
                        <td th:text="${rental.returnDeadline}">2026/07/04</td>
                        <td>
                            <span class="badge bg-warning text-dark" th:if="${rental.status == 'APPLIED'}">申請中</span>
                            <span class="badge bg-primary" th:if="${rental.status == 'RENTED'}">貸出中</span>
                            <span class="badge bg-success" th:if="${rental.status == 'RETURNED'}">返却済</span>
                        </td>
                        <td>
                        <!---  <form th:if="${rental.status == 'APPLIED'}" th:action="@{/admin/rentals/{id}/approve(id=${rental.rentalId})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-warning">承認する</button>
                            </form>
                            
                            <form th:if="${rental.status == 'RENTED'}" th:action="@{/admin/rentals/{id}/return(id=${rental.rentalId})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-primary">返却完了</button>
                            </form>  -->  
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
